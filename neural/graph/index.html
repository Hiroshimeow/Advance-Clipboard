<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #graph { width: 100vw; height: 100vh; }
        .node { stroke: #00ff41; stroke-width: 1.5px; cursor: pointer; }
        .link { stroke: #003b00; stroke-opacity: 0.6; stroke-width: 1px; }
        .label { fill: #00ff41; font-size: 10px; pointer-events: none; text-shadow: 0 0 5px #000; }
        .search-highlight { stroke: #fff !important; stroke-width: 3px !important; filter: drop-shadow(0 0 8px #00ff41); }
    </style>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div id="graph"></div>
    <script>
        const width = window.innerWidth;
        const height = window.innerHeight;
        const svg = d3.select("#graph").append("svg").attr("width", width).attr("height", height);
        const g = svg.append("g");

        const simulation = d3.forceSimulation()
            .force("link", d3.forceLink().id(d => d.id).distance(100))
            .force("charge", d3.forceManyBody().strength(-200))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(30));

        let link = g.append("g").attr("class", "links").selectAll("line");
        let node = g.append("g").attr("class", "nodes").selectAll("circle");
        let label = g.append("g").attr("class", "labels").selectAll("text");

        const zoom = d3.zoom().on("zoom", (e) => g.attr("transform", e.transform));
        svg.call(zoom);

        function updateGraph(data) {
            // data: { nodes: [{id, content, type}], links: [{source, target, weight}] }
            const nodes = data.nodes;
            const links = data.links;

            link = link.data(links, d => d.source.id + "-" + d.target.id).join("line").attr("class", "link");
            node = node.data(nodes, d => d.id).join("circle")
                .attr("class", "node")
                .attr("r", d => d.type === 'pinned' ? 8 : 5)
                .attr("fill", "#003b00")
                .on("click", (e, d) => window.pybridge.onNodeClick(d.id))
                .on("mouseover", (e, d) => showLabel(d.id))
                .on("mouseout", (e, d) => hideLabel(d.id));

            label = label.data(nodes, d => d.id).join("text")
                .attr("class", "label")
                .text(d => d.content.substring(0, 20))
                .style("opacity", 0);

            simulation.nodes(nodes);
            simulation.force("link").links(links);
            simulation.alpha(1).restart();
        }

        simulation.on("tick", () => {
            link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
            node.attr("cx", d => d.x).attr("cy", d => d.y);
            label.attr("x", d => d.x + 8).attr("y", d => d.y + 4);
        });

        function showLabel(id) { label.filter(d => d.id === id).style("opacity", 1); }
        function hideLabel(id) { label.filter(d => d.id === id).style("opacity", 0); }

        function focusNode(id) {
            const d = node.filter(n => n.id === id).datum();
            if (d) {
                const transform = d3.zoomIdentity.translate(width/2 - d.x*1.5, height/2 - d.y*1.5).scale(1.5);
                svg.transition().duration(750).call(zoom.transform, transform);
                node.classed("search-highlight", false);
                node.filter(n => n.id === id).classed("search-highlight", true);
                showLabel(id);
            }
        }

        // Bridge setup
        window.addEventListener('load', () => {
            if (window.qt) {
                new QWebChannel(qt.webChannelTransport, function (channel) {
                    window.pybridge = channel.objects.pybridge;
                });
            }
        });
    </script>
</body>
</html>
